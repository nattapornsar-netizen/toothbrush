<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ร้านแปรงดี — แปรงสีฟันคุณภาพ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <nav><b>🪥 ร้านแปรงดี</b><a href="admin.html">หลังร้าน (แพ็คของ)</a></nav>
  <h1>ยิ้มสวย เริ่มที่แปรงดี</h1>
  <p>แปรงสีฟันคุณภาพ ส่งไวทั่วไทย</p>
  <a href="#shop" class="btn">ช้อปเลย</a>
</header>

<section id="shop">
  <h2>สินค้าของเรา</h2>
  <div id="products" class="grid">กำลังโหลด...</div>
</section>

<section id="checkout">
  <h2>ตะกร้า & สั่งซื้อ</h2>
  <div id="cart"></div>
  <form id="orderForm">
    <input name="name" placeholder="ชื่อ-นามสกุล" required>
    <input name="phone" placeholder="เบอร์โทร" required pattern="[0-9]{9,10}">
    <textarea name="address" placeholder="ที่อยู่" required></textarea>
    <input name="province" placeholder="จังหวัด" required>
    <input name="zip" placeholder="รหัสไปรษณีย์" required pattern="[0-9]{5}">
    <button class="btn" type="submit">ยืนยันสั่งซื้อ</button>
  </form>
  <p id="msg"></p>
</section>

<footer>© 2026 ร้านแปรงดี</footer>

<script src="config.js"></script>
<script>
let products = [], cart = {};
const baht = n => "฿" + Number(n).toLocaleString();

async function init() {
  products = await loadProducts();
  document.getElementById("products").innerHTML = products.map(p => `
    <div class="card">
      <img src="${p.image}" alt="${p.name}">
      <small>รหัสสินค้า ${p.sku}</small>
      <h3>${p.name}</h3>
      <p>${p.desc || ""}</p>
      <b>${baht(p.price)}</b>
      <button class="btn" onclick="add('${p.sku}')">ใส่ตะกร้า</button>
    </div>`).join("");
  renderCart();
}
function add(sku) { cart[sku] = (cart[sku] || 0) + 1; renderCart(); }
function sub(sku) { cart[sku]--; if (cart[sku] <= 0) delete cart[sku]; renderCart(); }
function items() {
  return Object.entries(cart).map(([sku, qty]) => {
    const p = products.find(x => x.sku === sku);
    return { sku, name: p.name, price: Number(p.price), qty };
  });
}
function renderCart() {
  const it = items();
  const total = it.reduce((s, i) => s + i.price * i.qty, 0);
  document.getElementById("cart").innerHTML = it.length
    ? it.map(i => `<div class="row">${i.name} <span><button onclick="sub('${i.sku}')">−</button> ${i.qty} <button onclick="add('${i.sku}')">+</button> ${baht(i.price * i.qty)}</span></div>`).join("")
      + `<div class="row total">รวม <span>${baht(total)}</span></div>`
    : "<p>ยังไม่มีสินค้าในตะกร้า</p>";
}
document.getElementById("orderForm").onsubmit = async e => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  if (!items().length) return msg.textContent = "กรุณาเลือกสินค้าก่อน";
  const f = Object.fromEntries(new FormData(e.target));
  msg.textContent = "กำลังบันทึก...";
  try {
    const res = await api({ action: "order", ...f, items: items() });
    msg.textContent = "✅ สั่งซื้อสำเร็จ เลขออเดอร์: " + res.orderId;
    cart = {}; renderCart(); e.target.reset();
  } catch (err) { msg.textContent = "❌ บันทึกไม่สำเร็จ (ตรวจ SCRIPT_URL ใน config.js)"; }
};
init();
</script>
</body>
</html>
